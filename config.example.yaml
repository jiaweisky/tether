# Tether example configuration. Secrets are referenced via ${VAR} (see .env.example).
# Values shown are the defaults unless noted otherwise.

server:
  base_url: http://127.0.0.1:8787
  token: ${AGENTSERVE_TOKEN:-}   # bearer token; ${VAR} / ${VAR:-default} are expanded from env
  request_timeout_s: 30
  sse_reconnect_ms: 1000
  working_directory: null     # the base's working dir (for the media spool path); pool entries carry their own
  pool: []                    # [{name, base_url, token, working_directory, default_agent, default_model}]

# Optional overrides only: the agent and model are discovered from agentd
# (GET /api/agent; the model is left to agentd's default), so agentd's own
# configuration is not restated here.
agent:
  default_agent: null         # override; unset = first agent exposed by GET /api/agent
  default_model: null         # override; unset = agentd defaultModel

model:
  context_limit: null         # optional override; by default the window comes from GET /api/model (contextLimit)

# Project sharing: either everyone shares one project, or each conversation
# leases its own isolated view of the source project.
projects:
  mode: shared                # shared | isolated
  isolation: worktree         # mode=isolated only: none | copy | worktree | overlay
  base_dir: /var/lib/tether/workspaces   # mode=isolated: views + per-instance roots
  ttl_s: 3600                 # idle lease reclamation (mode=isolated)
  max_leases: 32
  git_base_ref: HEAD          # worktree starting point
  cow:
    mode: auto                # auto | reflink | clonefile (overlay)
    base_readonly: true
  # mode=isolated (agentd control API)
  control_url: null           # e.g. http://127.0.0.1:9090
  control_token: null         # bearer (optional on loopback)
  source_directory: null      # the project to derive views from (absolute)

sessions:
  idle_reset_s: 0
  busy_delivery: queue        # queue | steer
  max_active_routes: 1000
  validate_session: true      # on the first message after a restart, verify the session still exists (and recreate it if not)
  interrupt_on_shutdown: false  # false = leave in-progress turns/parked interactions to agentd so a restart can resume them
  turn_watchdog_s: 30         # finish an active turn whose agentd session is gone (lost idle); 0 disables

dedup:
  ttl_s: 600

group:
  inject_speaker: true
  speaker_format: "[{name}]: {text}"
  mention_others: true
  reply_with_mention: true
  cross_user_delivery: queue  # queue | steer_same_user
  admins: []
  hitl_scope: initiator       # initiator | participants | admins
  command_scope: initiator    # initiator | admins
  queue_backup_hint: true

identity:
  inject: on_change           # once | always | on_change
  source: im                  # im | agent | config
  display_name: null          # bot name: REQUIRED when WeCom is enabled; optional override otherwise
  description: null           # bot description: REQUIRED when WeCom is enabled; optional override otherwise
  warn_on_mismatch: true
  sync_participants: false
  preamble_tag: bridge-context

streaming:
  mode: auto                  # auto | native | edit | chunk | final
  min_interval_ms: 700
  idle_progress_ms: 2000
  boundary_flush: true
  max_live_chars: 4000
  rate_limit_backoff: 2.0
  show_tools: true
  show_reasoning: false
  reasoning_style: collapsible  # collapsible | separate | inline
  show_usage: true
  max_chars_override: null

media:
  inline_limit_bytes: 10485760
  max_bytes: 52428800
  spool_dir: "{working_dir}/.tether/spool"
  fetch_url_outbound: false
  outbound:
    sources: [tool_media]     # tool_media | changed_files
    image_max_bytes: 10485760

permissions:
  # Before using a tool the agent asks "allow? once / always / reject". This
  # section is how *Tether* handles that ask on your behalf, per tool:
  #   ask    -> forward the ask to you (you pick once / always / reject)
  #   once   -> answer it for you with "allow once"
  #   always -> answer it for you with "always allow"
  #   reject -> answer it for you with "deny"
  # The agent asks on *every* call, so `once` here replies "allow once" to each
  # ask -> effectively auto-approves every call (not just a single one).
  auto:
    read: once
    glob: once
    grep: once
    webfetch: ask
    bash: ask
    write: ask
    edit: ask
    apply_patch: ask
  default: ask
  timeout_s: 300
  fallback: reject            # reject | allow
  poll_interval_s: 30

commands:
  prefix: "/"

access:
  allow_users: []               # allowed user ids (empty = unrestricted)
  allow_groups: []              # allowed group ids (empty = unrestricted)
  admins:                       # per-channel/bot admins; null = fall back to group.admins
    wecom: null
    feishu: null
    qq: null
    wechat: {}                  # bot id -> user ids

channels:
  wecom:
    enabled: false
    bot_id: ${WECOM_BOT_ID:-}
    secret: ${WECOM_BOT_SECRET:-}
    welcome_text: null
  feishu:
    enabled: false
    app_id: ${FEISHU_APP_ID:-}
    app_secret: ${FEISHU_APP_SECRET:-}
  qq:
    enabled: false
    appid: ${QQ_BOT_APPID:-}
    secret: ${QQ_BOT_SECRET:-}
  wechat:
    enabled: false
    qr_timeout_s: 480
    bots:
      - id: assistant                 # hidden route-key segment; do not rename casually
        enabled: true                 # false = pre-provision only (no long-poll)
        identity:
          display_name: "微信助手"     # required: WeChat exposes no bot nickname/remark
          description: "微信小助手"
        login_via:                    # `/login wechat` from these DMs logs this bot in;
          # at least one channel here must be enabled (there is no CLI login).
          - {channel: wecom, user: "<wecom-user-id>"}
          - {channel: feishu, user: "<feishu-open-id>"}


# Health/metrics: an optional HTTP endpoint plus a periodic structured log line.
metrics:
  listen: null                # e.g. 127.0.0.1:9091 → GET /healthz and GET /metrics; null = no listener
  log_interval_s: 60          # also log a "metrics" event every N seconds (0 disables)

logging:
  level: INFO
  json: true
